# Generated by the openpush export. The package is built from skills/openpush-scan.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpush-scan"
version = "0.1.0"
description = "Privacy-first OpenPush SDK usage scanner"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SuperTuned" }]
requires-python = ">=3.9"
dependencies = ["keyring>=25,<26"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://www.openpush.ai"
Documentation = "https://www.openpush.ai/docs/guides/codebase-scan"
Source = "https://github.com/SuperTuned/openpush-skills"

[project.scripts]
openpush-scan = "openpush_scan.cli:main"

[tool.setuptools]
packages = ["openpush_scan", "openpush_scan.extract", "openpush_scan_skill"]
include-package-data = false

[tool.setuptools.package-dir]
openpush_scan = "skills/openpush-scan/scripts/openpush_scan"
openpush_scan_skill = "skills/openpush-scan"

[tool.setuptools.package-data]
openpush_scan = ["manifest.schema.json", "templates/*"]
openpush_scan_skill = ["SKILL.md", "agents/*.md", "degraded/*.md", "reference/*.md"]
